# Add these two locations inside the existing hithanis.com HTTPS server block.
# The other application locations and all existing listener ports stay unchanged.
location = /job-finder {
    return 308 /job-finder/;
}

location ^~ /job-finder/ {
    proxy_pass http://172.20.0.1:8765/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 600s;
    client_max_body_size 6m;
}
