<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Job Finder{% endblock %}</title><link rel="stylesheet" href="{{ base_path }}/static/app.css?v=2"></head><body>
<header><div class="shell"><div class="brand"><span class="brand-icon" aria-hidden="true">↗</span><strong>Job Finder</strong></div><nav aria-label="Main navigation">{% for route,label in [('/','Search'),('/profile','My profile'),('/my-jobs','Jobs Opened Status'),('/alerts','Alerts')] %}<a href="{{ base_path }}{{ route }}" {% if request.url.path==route %}aria-current="page"{% endif %}>{{ label }}</a>{% endfor %}{% if is_admin %}<a href="{{ base_path }}/activity" {% if request.url.path=='/activity' %}aria-current="page"{% endif %}>Activity</a>{% endif %}</nav><form class="inline-form" method="post" action="{{ base_path }}/logout"><input type="hidden" name="_csrf" value="{{ csrf }}"><button class="secondary">Sign out</button></form></div></header>
<main class="shell">{% block content %}{% endblock %}</main>
<script>document.querySelectorAll('img[data-logo]').forEach(img=>{img.addEventListener('error',()=>{img.parentElement.classList.add('no-image');img.remove()});if(img.complete&&img.naturalWidth===0){img.parentElement.classList.add('no-image');img.remove()}});document.querySelectorAll('form[data-busy]').forEach(form=>form.addEventListener('submit',()=>{const b=form.querySelector('button[type=submit]');if(b){b.disabled=true;b.textContent=form.dataset.busy}}));</script>
</body></html>
