<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · Job Finder</title>
<style>body{font:16px system-ui,sans-serif;background:#f4f8fb;color:#213047;margin:0;display:grid;place-items:center;min-height:100vh}main{background:white;padding:32px;border:1px solid #dce2e8;border-radius:12px;width:min(92vw,420px)}label{display:block;margin:20px 0 6px;font-weight:600}input{width:100%;padding:12px;font:inherit;box-sizing:border-box}button{margin-top:20px;padding:11px 18px;background:#154f80;color:#fff;border:0;border-radius:7px;font:inherit;cursor:pointer}.error{color:#9a2828}</style>
</head><body><main><h1>Job Finder</h1><p>Sign in to see your private job search.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post" action="{{ base_path }}/login"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button>Sign in</button></form></main></body></html>
